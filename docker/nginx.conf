# The service's site (compose.yaml): every request goes to public/index.php, run by the php
# container (PHP-FPM).
#
# minipavi-stack's services container proxies http://services/<code>/... here, without /<code>:
# it sends the host and path the gateway asked for in X-Forwarded-Host and X-Forwarded-Prefix.
# The service builds the next URL it gives the gateway from HTTP_HOST and PHP_SELF (the
# framework's RequestUrl): they are set back to that host and path, so that the gateway calls
# http://services/<code>/index.php rather than this container's address.

# Proxies whose X-Forwarded-* headers are believed: Docker's networks (any client could send them)
geo $from_proxy {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

map "$from_proxy:$http_x_forwarded_host" $service_host {
    "~^1:(?<forwarded>[A-Za-z0-9.-]+(:[0-9]+)?)$" $forwarded;
    default                                        $http_host;
}

map "$from_proxy:$http_x_forwarded_prefix" $service_prefix {
    "~^1:(?<forwarded>(/[A-Za-z0-9_-]+)+)$" $forwarded;
    default                                  "";
}

server {
    listen 80;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME     $service_prefix/index.php;
        fastcgi_param PHP_SELF        $service_prefix/index.php;
        fastcgi_param REQUEST_URI     $service_prefix$request_uri;
        fastcgi_param HTTP_HOST       $service_host;
        fastcgi_pass php:9000;
    }
}

# The service in its own Docker stack, joined to minipavi-stack's network (start the stack
# first: it creates the network). The stack reaches it at http://my-service/: list it in the
# stack's config/local-services.xml with that URL and a code (README, "Running it").
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks:
      default:
      minipavi:
        # Rename it for each service: the stack reaches it by this name
        aliases: [my-service]

  php:
    build: .
    restart: unless-stopped
    environment:
      # Key signing the context given to the gateway (in .env, beside this file)
      CONTEXT_SECRET: ${CONTEXT_SECRET:-}
    volumes:
      # The service's folder as it is, vendor/ included: a change is served right away
      - ./:/var/www/app:ro

networks:
  minipavi:
    external: true
